name: Build and Release (macOS & Windows)

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Release version (e.g. v3.6.4)'
        required: false
        default: 'v3.6.4'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (DMG & ZIP)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Make scripts executable
        run: |
          chmod +x build.sh release.sh

      - name: Build macOS Application and DMG
        env:
          PYTHON: python3
        run: |
          ./release.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-artifacts
          path: dist/release/*
          if-no-files-found: error

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pyinstaller pillow tkinterdnd2 psutil mkpfs==0.0.8 cryptography lz4 toml

      - name: Build Windows Executable
        run: |
          python -m PyInstaller --onefile --windowed --clean --noconfirm `
            --name "exFAT Image Builder" `
            --icon="controller.ico" `
            --hidden-import PIL._tkinter_finder `
            --hidden-import psutil `
            --hidden-import mkpfs `
            --hidden-import mkpfs.__main__ `
            --hidden-import mkpfs.cli `
            --hidden-import mkpfs.pfs `
            --hidden-import mkpfs.utils `
            --hidden-import mkpfs.consts `
            --hidden-import mkpfs.logging `
            --hidden-import mkpfs.pbar `
            --hidden-import cryptography `
            --hidden-import cryptography.hazmat.primitives.ciphers `
            --hidden-import cryptography.hazmat.primitives.ciphers.algorithms `
            --hidden-import cryptography.hazmat.primitives.ciphers.modes `
            --hidden-import cryptography.hazmat.backends `
            --hidden-import cryptography.hazmat.backends.openssl `
            --hidden-import cryptography.hazmat.backends.openssl.backend `
            --collect-all mkpfs `
            --collect-all cryptography `
            --collect-all tkinterdnd2 `
            --collect-all lz4 `
            --collect-all toml `
            --collect-submodules ui `
            --collect-submodules ui.shared `
            --paths . `
            exfat_builder.py

      - name: Package Windows Release & Calculate SHA256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\release
          Copy-Item "dist\exFAT Image Builder.exe" -Destination "dist\release\"
          Compress-Archive -Path "dist\exFAT Image Builder.exe" -DestinationPath "dist\release\exFAT-Image-Builder-Windows.zip" -Force
          
          cd dist\release
          $hash = (Get-FileHash -Algorithm SHA256 "exFAT Image Builder.exe").Hash.ToLower()
          "$hash  exFAT Image Builder.exe" | Out-File -Encoding ASCII "exFAT Image Builder.exe.sha256"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: dist/release/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Display Release Assets
        run: |
          ls -la all-artifacts

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            all-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
